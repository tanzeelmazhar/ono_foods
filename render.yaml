services:
  - type: web
    name: ono-food-preview
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run db:migrate && npm start
    initialDeployHook: cd backend && npm run db:seed && npm run admin:create
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: ono-food-preview-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: TRACKING_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: STORE_TIMEZONE
        value: Asia/Karachi
      - key: STORE_OPEN_TIME
        value: "11:00"
      - key: STORE_CLOSE_TIME
        value: "24:00"
      - key: MIN_ORDER_SUBTOTAL
        value: "500.00"
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        sync: false
      - key: ADMIN_BOOTSTRAP_PHONE
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

databases:
  - name: ono-food-preview-db
    databaseName: ono_food
    user: ono_app
    plan: free
    region: singapore
    postgresMajorVersion: "18"
